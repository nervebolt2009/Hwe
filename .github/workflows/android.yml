# Wearsic Android CI & Release pipeline.
#
# - Every push/PR: unit tests + debug APK artifact.
# - Tag push (v*): signed release APK attached to a GitHub Release.
#
# Required repository secrets for the release job:
#   KEYSTORE_BASE64  – base64 of my-upload-key.jks
#                      (create locally: keytool -genkeypair -v -keystore my-upload-key.jks \
#                       -alias upload -keyalg RSA -keysize 2048 -validity 10000
#                      then: base64 -w0 my-upload-key.jks)
#   STORE_PASSWORD   – keystore password
#   KEY_PASSWORD     – key password (alias "upload")
name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Robolectric unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

  build-debug:
    name: Debug APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wearsic-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk

  release:
    name: Release APK
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    environment: release
    steps:
      - uses: actions/checkout@v4

      - name: Verify signing secrets are configured
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=0
          for s in KEYSTORE_BASE64 STORE_PASSWORD KEY_PASSWORD; do
            if [ -z "${!s}" ]; then echo "::error::Missing repository secret: $s"; missing=1; fi
          done
          exit $missing

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble signed release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Set up Python for V2 package validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate and package V2 server
        run: |
          python -m compileall -q wearsic-server-v2/app wearsic-server-v2/tests
          bash -n wearsic-server-v2/run-termux.sh
          rm -rf dist wearsic-server-v2/dist
          mkdir -p dist
          zip -qr "dist/wearsic-server-v2.zip" \
            wearsic-server-v2/app \
            wearsic-server-v2/tests \
            wearsic-server-v2/requirements.txt \
            wearsic-server-v2/.env.example \
            wearsic-server-v2/.gitignore \
            wearsic-server-v2/README.md \
            wearsic-server-v2/run-termux.sh \
            wearsic-server-v2/Makefile

      - name: Stage and verify release assets
        run: |
          cp app/build/outputs/apk/release/app-release.apk "dist/Wearsic-${GITHUB_REF_NAME}.apk"
          cp wearsic-server-termux-FIXED.zip "dist/wearsic-server-termux-FIXED.zip"
          test -s "dist/wearsic-server-v2.zip"
          test -s "dist/wearsic-server-termux-FIXED.zip"
          test -s "dist/Wearsic-${GITHUB_REF_NAME}.apk"
          unzip -Z1 "dist/wearsic-server-v2.zip" | grep -q '^wearsic-server-v2/app/main.py$'
          echo "Release assets:"
          ls -lh dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Wearsic $GITHUB_REF_NAME" \
            --generate-notes \
            "dist/Wearsic-${GITHUB_REF_NAME}.apk" \
            "dist/wearsic-server-termux-FIXED.zip" \
            "dist/wearsic-server-v2.zip"
